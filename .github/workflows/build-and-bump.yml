name: build-and-bump

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      images:
        required: true
        type: string
      manifest_dir:
        required: false
        type: string
        default: ""
      manifest_repo:
        required: false
        type: string
        default: "gitupcourt/homelab"

jobs:
  build:
    name: build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "image=${{ matrix.image.name }} ctx=${{ matrix.image.context }}"
