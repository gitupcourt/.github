name: build-and-bump

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      images:
        required: true
        type: string
      manifest_dir:
        required: false
        type: string
        default: ""
      manifest_repo:
        required: false
        type: string
        default: "gitupcourt/homelab"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - run: echo "image=${{ matrix.image.name }}"
