name: build-and-bump

# Reusable workflow. See README.md in this repo for the calling pattern.
#
# Builds one or more container images per push, pushes to GHCR with
# deterministic tags, then optionally opens a PR in `gitupcourt/homelab`
# bumping the corresponding manifest's `image:` line. The PR step is gated
# on the `HOMELAB_PAT` org secret existing — if it's absent, the build half
# still runs and the bump half is skipped with a warning instead of failing.

on:
  workflow_call:
    inputs:
      app_name:
        description: "Logical app name. Used as the GHCR image-name prefix and the PR title."
        required: true
        type: string
      images:
        description: |
          JSON array, one entry per image. Each entry: { name, context, dockerfile? }
            name       — image suffix (e.g. "backend" → ghcr.io/<owner>/<app>-backend)
            context    — docker build context dir
            dockerfile — optional path relative to context (default: ./Dockerfile)
        required: true
        type: string
      manifest_dir:
        description: |
          Path inside the homelab repo whose manifests should be bumped.
          Empty string skips the bump-PR job entirely (useful for apps not
          yet deployed to the cluster).
        required: false
        type: string
        default: ""
      manifest_repo:
        description: "Full repo to open the bump PR against."
        required: false
        type: string
        default: "gitupcourt/homelab"
      registry:
        description: "Container registry."
        required: false
        type: string
        default: "ghcr.io"

jobs:
  # =====================================================================
  # Build + push each image in parallel via matrix.
  #
  # Outputs the `sha-<short>` tag to the bump job so manifests get pinned
  # to the exact build this run produced (not a mutable "latest").
  # =====================================================================
  build:
    name: build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write    # for ghcr push using GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    outputs:
      sha_tag: ${{ steps.tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        id: tag
        run: |
          short=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_tag=sha-${short}" >> "$GITHUB_OUTPUT"
          echo "Short SHA tag: sha-${short}"

      - name: Log in to ${{ inputs.registry }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # `docker/metadata-action` does the tag math: every build gets the
      # immutable sha-<short> tag plus `latest` only on the default branch.
      # Branches and PRs get their own tags so you can pull a build by SHA
      # or by branch name without colliding with prod's `latest`.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.app_name }}-${{ matrix.image.name }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.sha_tag }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push ${{ matrix.image.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.context }}/${{ matrix.image.dockerfile && matrix.image.dockerfile || 'Dockerfile' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache via GHA's built-in cache so subsequent runs are fast.
          cache-from: type=gha,scope=${{ inputs.app_name }}-${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app_name }}-${{ matrix.image.name }}

  # =====================================================================
  # Open a PR in the homelab repo bumping the image tags this build
  # produced. Skipped silently if the caller didn't pass manifest_dir
  # or if the HOMELAB_PAT secret isn't configured.
  # =====================================================================
  bump-manifest:
    name: bump homelab manifest
    needs: build
    if: ${{ inputs.manifest_dir != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check PAT is configured
        id: check
        env:
          PAT: ${{ secrets.HOMELAB_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::warning::HOMELAB_PAT org secret not set — skipping manifest bump. See gitupcourt/.github README for setup."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout homelab
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.manifest_repo }}
          token: ${{ secrets.HOMELAB_PAT }}
          path: homelab

      - name: Bump image tags
        if: steps.check.outputs.skip != 'true'
        id: bump
        env:
          SHA_TAG: ${{ needs.build.outputs.sha_tag }}
          IMAGES_JSON: ${{ inputs.images }}
          APP: ${{ inputs.app_name }}
          MANIFEST_DIR: ${{ inputs.manifest_dir }}
        # Iterate each image and rewrite any `image: ghcr.io/.../<app>-<name>:...`
        # line found inside the manifest dir to point at the new sha-<short>
        # tag. Sed is sufficient because we control the surrounding text
        # (no YAML parser dance needed — the line is unambiguous).
        run: |
          set -euo pipefail
          cd homelab
          changed=0
          for row in $(echo "$IMAGES_JSON" | jq -c '.[]'); do
            name=$(echo "$row" | jq -r '.name')
            pattern="ghcr.io/${{ github.repository_owner }}/${APP}-${name}"
            echo "Looking for: $pattern"
            # GNU sed in-place; -E for extended regex
            find "$MANIFEST_DIR" -type f \( -name '*.yaml' -o -name '*.yml' \) -print0 \
              | xargs -0 -I {} sed -i -E "s#(image:\s*)${pattern}:[A-Za-z0-9._-]+#\1${pattern}:${SHA_TAG}#g" {}
          done
          if git diff --quiet; then
            echo "No manifest changes — images may already be at this SHA."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Open PR
        if: steps.check.outputs.skip != 'true' && steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          path: homelab
          token: ${{ secrets.HOMELAB_PAT }}
          branch: bump/${{ inputs.app_name }}/${{ needs.build.outputs.sha_tag }}
          commit-message: |
            ${{ inputs.app_name }}: bump to ${{ needs.build.outputs.sha_tag }}
          title: "${{ inputs.app_name }}: bump to ${{ needs.build.outputs.sha_tag }}"
          body: |
            Automated bump from CI in `${{ github.repository }}` @ ${{ github.sha }}.

            **App:** `${{ inputs.app_name }}`
            **New tag:** `${{ needs.build.outputs.sha_tag }}`
            **Build run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Merge this PR, then on `appserver01`:

            ```
            k3s kubectl apply -f manifests/${{ inputs.app_name }}/
            k3s kubectl rollout status deploy/${{ inputs.app_name }}-backend  # adjust if needed
            ```
          delete-branch: true
